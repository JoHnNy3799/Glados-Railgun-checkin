name: auto check

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  # 2026-10 观测：schedule 的 timezone 键不可靠，且 GitHub 高负载时会直接丢弃
  # 某个触发点——原来的双时段配置每天实际只跑一次。因此改为直接写 UTC 时间、
  # 拉开三个时段互为备份（对应北京时间 09:18 / 12:18 / 20:48）。
  # 签到一天只生效一次，重复触发只会得到“重复签到”，多跑没有副作用。
  schedule:
    - cron: '18 1 * * *'
    - cron: '18 4 * * *'
    - cron: '48 12 * * *'

# 前一时段被延迟、与后一时段撞车时排队而非并发，避免同时签到
concurrency:
  group: checkin
  cancel-in-progress: false

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest
      
    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 执行 签到脚本
    - name: Running checkin
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

    # 以下两步必须在签到失败时也执行：keepalive 负责重置 GitHub 的 60 天停用计时器，
    # 若因签到退出码非 0 被跳过，定时任务反而会在仓库不活跃后被自动停用。
    - name: Keep alive
      if: always()
      uses: liskin/gh-workflow-keepalive@v1

    - name: Delete workflow runs
      if: always()
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
