name: GLaDOS Check-in

on:
  workflow_dispatch:
    inputs:
      test_push:
        description: '只发送一条方糖测试推送（验证提醒通道）'
        type: boolean
        default: false
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  # 2026-10 实测：schedule 的 timezone 键不可靠且高负载时 GitHub 会直接丢弃
  # 某个触发点。直接写 UTC 时间，对应北京时间 21:00——本机浏览器计划任务
  # （09:30 / 14:00 两次签到机会）都跑完之后的收尾看护时点。
  schedule:
    - cron: '0 13 * * *'

# 定时与手动触发可能重叠：同一时间只保留一个运行，避免重复签到与重复推送
concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest

    # 脚本自带 5 分钟运行预算；这里再兜底，避免异常情况卡住
    timeout-minutes: 15

    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 只读看护：检查 Cookie 认证状态（真实签到由本机浏览器计划任务完成，
    # 云端纯 HTTP 无法通过 Cloudflare Turnstile，详见 README 与 watch.py）
    - name: Running watch
      run: |
        python watch.py
      env:
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        TEST_PUSH: ${{ inputs.test_push }}

    # 签到失败（配置错误会 exit 1）时也要保活，否则恰好错过最需要提醒的那次
    - name: Keep alive
      if: ${{ !cancelled() }}
      uses: liskin/gh-workflow-keepalive@v1 
        
    - name: Delete workflow runs
      if: ${{ !cancelled() }}
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
